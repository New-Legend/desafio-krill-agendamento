server:
  port: 8080
  forward-headers-strategy: framework
  error:
    include-stacktrace: never

spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  application:
    name: agendamento-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agendamento}
    username: ${DB_USER:agendamento}
    password: ${DB_PASSWORD:agendamento}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    time-zone: America/Sao_Paulo
    default-property-inclusion: non_null
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000

app:
  timezone: America/Sao_Paulo
  url-publica: ${APP_URL_PUBLICA:http://localhost:8081}
  erp:
    provedor: ${ERP_PROVEDOR:local}
    bluesoft:
      base-url: ${BLUESOFT_BASE_URL:https://erp.bluesoft.com.br}
      tenant: ${BLUESOFT_TENANT:}
      client-id: ${BLUESOFT_CLIENT_ID:}
      client-secret: ${BLUESOFT_CLIENT_SECRET:}
      timeout-segundos: ${BLUESOFT_TIMEOUT:10}
  whatsapp:
    provedor: ${WHATSAPP_PROVEDOR:desabilitado}
    api-url: ${WHATSAPP_API_URL:https://graph.facebook.com/v20.0}
    token: ${WHATSAPP_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    timeout-segundos: ${WHATSAPP_TIMEOUT:10}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:8081}
  jwt:
    secret: ${JWT_SECRET:desenvolvimento-local-troque-este-segredo-32bytes!}
    expiracao-minutos: ${JWT_EXPIRACAO_MINUTOS:480}
  mail:
    remetente: ${MAIL_FROM:recebimento@redekrill.com.br}
  push:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:recebimento@redekrill.com.br}
  usuarios-iniciais:
    admin-senha: ${ADMIN_PASSWORD:admin123}
    usuario-senha: ${USUARIO_PASSWORD:usuario123}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false
