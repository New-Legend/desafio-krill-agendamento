server:
  port: 8080
  forward-headers-strategy: framework
  error:
    include-stacktrace: never

spring:
  application:
    name: agendamento-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agendamento}
    username: ${DB_USER:agendamento}
    password: ${DB_PASSWORD:agendamento}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    time-zone: America/Sao_Paulo
    default-property-inclusion: non_null
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000

app:
  timezone: America/Sao_Paulo
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:8081}
  jwt:
    secret: ${JWT_SECRET:desenvolvimento-local-troque-este-segredo-32bytes!}
    expiracao-minutos: ${JWT_EXPIRACAO_MINUTOS:480}
  mail:
    remetente: ${MAIL_FROM:recebimento@redekrill.com.br}
  push:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:recebimento@redekrill.com.br}
  usuarios-iniciais:
    admin-senha: ${ADMIN_PASSWORD:admin123}
    usuario-senha: ${USUARIO_PASSWORD:usuario123}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
